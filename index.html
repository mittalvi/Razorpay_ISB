<title>Razorpay Open Box Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: flow navigator on the left, one live device (phone or Merchant Hub) on a stage. Devices keep the light look of the product boards in both themes. */
:root{
  --bg:#EDF1F8; --panel:#FFFFFF; --ink:#0E1A33; --muted:#5C6880; --line:#DCE2EC;
  --accent:#1A5CFF; --accent-soft:#E6EEFF; --chip:#F3F6FB; --shadow:rgba(15,23,42,.18);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1220; --panel:#141C2D; --ink:#E6ECF7; --muted:#94A1B9; --line:#26324A;
  --accent:#6A97FF; --accent-soft:#1B2A4D; --chip:#1A2336; --shadow:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1220; --panel:#141C2D; --ink:#E6ECF7; --muted:#94A1B9; --line:#26324A;
  --accent:#6A97FF; --accent-soft:#1B2A4D; --chip:#1A2336; --shadow:rgba(0,0,0,.55); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #1A5CFF;outline-offset:2px}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100%;padding-inline:16px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px;border-bottom:1px solid var(--line)}
.top .name{display:flex;align-items:center;gap:10px;min-width:0}
.top .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.top h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em}
.top h1 small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.ctl{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-left:auto}
.ctl label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.seg{display:inline-flex;background:var(--chip);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:7px;font-size:12.5px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}
.ghost{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 12px;font-size:12.5px}
.grp{display:flex;align-items:center;gap:8px}
.main{flex:1;min-height:0;display:grid;grid-template-columns:268px 1fr;gap:20px;padding-block:16px}
.flow{overflow:auto;min-height:0;padding-right:6px}
.flow h4{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;font-weight:650}
.flow h4:first-child{margin-top:2px}
.flow button{display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:8px;font-size:13px;line-height:1.35}
.flow button .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;min-width:22px;font-size:12px}
.flow button:hover{background:var(--chip)}
.flow button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.flow button.on .n{color:var(--accent)}
.stage{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px}
.cap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.cap .txt{flex:1;min-width:0}
.cap .tag{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:650}
.cap h2{margin:2px 0 2px;font-size:19px;letter-spacing:-.015em;text-wrap:balance}
.cap p{margin:0;color:var(--muted);font-size:13.5px;max-width:70ch}
.cap .pn{display:flex;gap:8px;align-items:center}
.cap select{display:none;max-width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px;font:inherit;font-size:13px}
.devwrap{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start}
.fit{position:relative;flex:none}
.fit>.device{position:absolute;left:0;top:0;transform-origin:0 0}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0E1624;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;max-width:min(520px,calc(100vw - 32px));box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:50}
@media (max-width:980px){
  .main{grid-template-columns:1fr}
  .flow{display:none}
  .cap select{display:block;width:100%;margin-top:8px}
  .cap{flex-direction:column;gap:10px}
  .cap .txt{width:100%}
  .ctl{margin-left:0}
}

/* ---------- phone (fixed light palette, matches the boards) ---------- */
.ph{width:375px;height:790px;border-radius:48px;background:#fff;border:10px solid #0D1016;overflow:hidden;position:relative;display:flex;flex-direction:column;color:#0F172A;font-family:var(--font);box-shadow:0 30px 60px -24px var(--shadow);font-size:13.5px}
.ph::after{content:"";position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:120px;height:4.5px;border-radius:3px;background:#0D1016;opacity:.9;z-index:5}
.sb{height:42px;padding:14px 26px 0 30px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;flex:none;color:#0F172A}
.sb .sbi{display:flex;gap:5px;align-items:center}
.hd{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex:none}
.hd .t{font-weight:600;font-size:16px}
.ib{width:36px;height:36px;display:grid;place-items:center;border:0;background:transparent;border-radius:10px;color:#0F172A}
span.ib{cursor:default}
.brand{letter-spacing:.34em;font-weight:500;font-size:14.5px;padding-left:.34em}
.scr{flex:1;overflow-y:auto;padding:4px 18px 18px;min-height:0}
.scr.np{padding:0}
.foot{padding:10px 18px 26px;flex:none;background:#fff;display:flex;flex-direction:column;gap:8px}
.btn{height:46px;border-radius:10px;border:0;font-weight:600;font-size:14.5px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.dark{background:#111826;color:#fff}
.btn.blue{background:#1A5CFF;color:#fff}
.btn.green{background:#1F9D47;color:#fff}
.btn.red{background:#E43B34;color:#fff}
.btn.out{background:#fff;color:#0F172A;border:1.5px solid #CBD2DE}
.btn.two{flex-direction:column;gap:1px;height:52px}
.btn.two small{font-weight:500;font-size:11.5px;opacity:.8}
.btn:disabled{opacity:.38;cursor:not-allowed}
.lnk{border:0;background:transparent;color:#1A5CFF;font-weight:500;padding:0;font-size:13px}
.lnk.c{align-self:center;padding:6px}
.muted{color:#64708A}
.row{display:flex;align-items:center}
.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}
.sbt{justify-content:space-between}
h2.ttl{font-size:20px;margin:6px 0 2px;letter-spacing:-.015em}
p.sub{color:#5E6A82;margin:0 0 14px;font-size:13px;line-height:1.45}
h3.sec{font-size:15px;margin:18px 0 10px}
.card{border:1px solid #E5E8F0;border-radius:12px;background:#fff;padding:12px 14px}
.soft{background:#F6F8FC;border-radius:12px;padding:14px}
.tg{background:#EFF8F2}.tr{background:#FFF2F1}.tb{background:#EEF3FF}.ta{background:#FFF7E7}.tl{background:#F1F0FF}
.ok{color:#1F9D47}.bad{color:#E43B34}.amb{color:#D88A00}.bl{color:#1A5CFF}
.circ{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;flex:none}
.circ.g{background:#1F9D47}.circ.r{background:#E43B34}.circ.b{background:#1A5CFF}.circ.a{background:#F0A21A}
.big-ok{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:8px auto 14px;color:#fff}
.center{text-align:center}
.list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
.list li{display:flex;gap:10px;align-items:flex-start;line-height:1.35}
.list li .i{flex:none;margin-top:1px}
.added{background:#E8F0FF;border-radius:7px;padding:3px 6px;margin:-3px -6px;color:#1446C8}
.tagx{font-size:10.5px;background:#DCE7FF;color:#1446C8;border-radius:5px;padding:1px 6px;margin-left:6px;white-space:nowrap;font-weight:500}
textarea.ta{width:100%;border:1px solid #DDE2EB;border-radius:10px;padding:10px 12px;font:inherit;font-size:13px;resize:none;color:#0F172A;background:#fff;line-height:1.45}
.cnt{text-align:right;font-size:11.5px;color:#7A859C;margin-top:4px;font-variant-numeric:tabular-nums}
.chk{width:20px;height:20px;border-radius:5px;border:1.6px solid #B9C2D2;display:grid;place-items:center;flex:none;background:#fff;color:#fff}
.chk.on{background:#1F9D47;border-color:#1F9D47}
.chk.on.b{background:#1A5CFF;border-color:#1A5CFF}
.rad{width:20px;height:20px;border-radius:50%;border:1.6px solid #B9C2D2;flex:none;display:grid;place-items:center;background:#fff}
.rad.on{border:6px solid #1A5CFF}
.rad.on.g{border-color:#1F9D47}
.pill{font-size:11px;border-radius:6px;padding:2px 7px;font-weight:600}
.pill.g{background:#E3F5E9;color:#18833B}

/* product page */
.hero{background:#F3F1EE;height:250px;display:grid;place-items:center;overflow:hidden}
.hero img{height:238px;object-fit:contain;mix-blend-mode:multiply}
.thumbs{display:flex;gap:10px;padding:10px 16px;background:#F3F1EE}
.thumb{width:58px;height:54px;border-radius:9px;border:1.5px solid transparent;background:#fff;padding:2px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:7px}
.thumb.on{border-color:#111826}
.pd{padding:12px 18px}
.pname{font-size:21px;margin:2px 0 2px;letter-spacing:-.015em}
.rate{margin:8px 0;font-size:13px}.star{color:#F2A900}
.price{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.price b{font-size:22px}.price s{color:#8A94A8;font-size:13px}
.off{background:#E3F5E9;color:#18833B;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600}
.feat{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;color:#3D475C;font-size:13px}
.feat li{display:flex;gap:10px;align-items:center}
.feat .i{color:#6B7690}

/* checkout */
.steps{display:flex;align-items:flex-start;margin:6px 4px 4px}
.stp{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:#8C96AA;width:60px}
.stp .d{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #C9D0DC;font-size:11.5px;font-weight:600;background:#fff}
.stp.on{color:#1A5CFF;font-weight:600}.stp.on .d{background:#1A5CFF;border-color:#1A5CFF;color:#fff}
.stp.dn .d{border-color:#1A5CFF;color:#1A5CFF}.stp.dn{color:#1A5CFF}
.sl{flex:1;height:1.5px;background:#D7DCE6;margin-top:12px}.sl.on{background:#1A5CFF}
.addr p{margin:4px 0 0;color:#46506A;font-size:12.5px;line-height:1.5}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid #E5E8F0;border-radius:12px;padding:12px;margin-bottom:10px;width:100%;background:#fff;text-align:left}
.opt.on{border-color:#1F9D47;background:#F2FAF4}
.opt .tx{flex:1;font-size:12.5px;color:#5E6A82;line-height:1.5}
.opt .tx b{color:#0F172A;font-size:13.5px;font-weight:600}
.rec{background:#1F9D47;color:#fff;border-radius:5px;font-size:10.5px;padding:2px 6px;margin-left:6px;font-weight:600;vertical-align:1px}

/* lists with rows */
.rlist{display:flex;flex-direction:column}
.rlist .r{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.rlist .r+.r{border-top:1px solid rgba(15,23,42,.06)}
.rlist .r b{font-weight:600;font-size:13px}
.rlist .r small{display:block;color:#64708A;font-size:12px;margin-top:1px;line-height:1.4}
.num{width:22px;height:22px;border-radius:50%;background:#E6ECFA;color:#1A5CFF;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.rowlink{display:flex;justify-content:space-between;align-items:center;border:1px solid #E5E8F0;border-radius:12px;padding:12px 14px;width:100%;background:#fff;margin-top:12px;font-weight:500;font-size:13px}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.tline{display:flex;flex-direction:column}
.tline .r{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tline .r:not(:last-child)::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:#BFE3CB}
.tline.b .r:not(:last-child)::before{background:#C9D8FF}
.tline.rd .r:not(:last-child)::before{background:#F6C6C3}
.tline b{font-size:13px;font-weight:600}
.tline small{display:block;color:#64708A;font-size:12px;margin-top:2px;line-height:1.4}
.prod{display:flex;gap:12px;align-items:center}
.prod img{width:62px;height:62px;border-radius:10px;object-fit:cover;background:#F3F1EE}
.prod .pt{font-size:12.5px;line-height:1.45;color:#46506A}
.prod .pt b{color:#0F172A;font-size:13.5px}

/* payment */
.upi{display:flex;align-items:center;gap:12px;padding:12px 4px;border:0;background:transparent;width:100%;text-align:left;font-size:13px}
.upi+.upi{border-top:1px solid #EEF0F5}
.upi .lg{width:30px;display:grid;place-items:center;font-weight:700}
.upi .nm{flex:1}
.rzp{font-style:italic;font-weight:800;color:#0C2451;display:inline-flex;align-items:center;gap:2px}
.fine{font-size:11.5px;color:#64708A;text-align:center;line-height:1.5;margin:0}
.overlay{position:absolute;inset:0;background:rgba(9,14,24,.45);display:flex;align-items:flex-end;z-index:6}
.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;padding:18px 18px 30px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid #DDE6FF;border-top-color:#1A5CFF;animation:sp .8s linear infinite;margin:6px auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* whatsapp */
.wa-hd{display:flex;align-items:center;gap:8px;padding:2px 10px 8px;border-bottom:1px solid #ECECEC;flex:none}
.wa-hd .who{flex:1;line-height:1.2}
.wa-hd .who b{font-size:14.5px;display:flex;align-items:center;gap:4px}
.wa-hd .who small{color:#667;font-size:11.5px}
.wa-logo{width:34px;height:34px;border-radius:50%;background:#E9F7EE;display:grid;place-items:center}
.wa-bg{background:#EFE7DD;padding:16px 12px}
.bubble{background:#fff;border-radius:4px 14px 14px 14px;padding:12px 12px 8px;box-shadow:0 1px 1px rgba(0,0,0,.08);font-size:13.5px;line-height:1.45}
.bubble p{margin:0 0 10px}
.bubble .tiny{font-size:11.5px;color:#667;margin:8px 0 0}
.bubble .time{font-size:11px;color:#889;text-align:right;margin:0}
.wa-card{display:flex;gap:10px;align-items:center;border:1px solid #EEE;border-radius:10px;padding:8px;margin-bottom:10px;font-size:12px;line-height:1.4}
.wa-card img{width:72px;height:66px;object-fit:cover;border-radius:8px}
.wa-card b{font-size:13px}
.wa-in{display:flex;align-items:center;gap:8px;padding:8px 10px 26px;background:#EFE7DD;flex:none}
.wa-in .box{flex:1;background:#fff;border-radius:22px;height:42px;display:flex;align-items:center;gap:10px;padding:0 12px;color:#889;font-size:14px}
.wa-in .mic{width:42px;height:42px;border-radius:50%;background:#1F9D47;color:#fff;display:grid;place-items:center}

/* inspection */
.cl{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;border:0;background:transparent;width:100%;text-align:left;font-size:13px;line-height:1.4}
.cl+.cl{border-top:1px solid #F0F2F6}
.ropt{display:flex;gap:12px;align-items:flex-start;padding:11px 10px;border:0;background:transparent;width:100%;text-align:left;border-radius:10px;font-size:13px;line-height:1.4}
.ropt.on{background:#EEF3FF}
.ropt small{display:block;color:#64708A}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.ph-t{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#EEE}
.ph-t img{width:100%;height:100%;object-fit:cover}
.ph-t button{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;padding:0}
.addph{aspect-ratio:1;border-radius:10px;border:1.5px dashed #BFC8D8;background:#F7F9FD;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#5E6A82;font-size:11px}
.prow{display:flex;align-items:center;gap:12px;border:1px solid #ECEFF4;border-radius:12px;padding:6px 12px 6px 6px;width:100%;background:#fff;margin-bottom:8px;text-align:left;font-size:13px}
.prow .im{width:84px;height:64px;border-radius:8px;overflow:hidden;background:#F4F6FA;display:grid;place-items:center;color:#8C96AA;flex:none}
.prow .im img{width:100%;height:100%;object-fit:cover}
.prow .lb{flex:1}
.prow .tap{font-size:11.5px;color:#1A5CFF;font-weight:500}
.aiimg{border-radius:12px;overflow:hidden;height:175px;margin:4px 0 10px;position:relative}
.aiimg img{width:100%;height:100%;object-fit:cover}
.res{border-radius:12px;padding:12px}
.res h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px}
.res p{margin:0 0 10px;font-size:12.5px;line-height:1.45;color:#3D475C}
.res .ev{display:flex;align-items:center;gap:14px}
.res .ev img{width:72px;height:56px;border-radius:8px;object-fit:cover}
.chip{display:flex;gap:10px;align-items:center;background:#EEF3FF;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
.scan{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#1A5CFF,transparent);top:0;animation:scan 1.6s ease-in-out infinite}
@keyframes scan{0%{top:4%}50%{top:94%}100%{top:4%}}
.steps-ai{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.steps-ai div{display:flex;gap:10px;align-items:center;font-size:13px;animation:fadein .4s both}
@keyframes fadein{from{opacity:.25}to{opacity:1}}
.conf{position:absolute;width:6px;height:6px;border-radius:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px;margin:10px 0 14px}
.kv dt{color:#64708A}.kv dd{margin:0;font-weight:500}

/* ---------- Merchant Hub (fixed light palette) ---------- */
.dk{width:1120px;height:700px;border-radius:16px;overflow:hidden;display:flex;background:#F6F8FB;border:1px solid #D7DDE8;color:#0F172A;font-family:var(--font);box-shadow:0 30px 60px -28px var(--shadow);font-size:13px}
.mside{width:204px;background:#0F1A2C;color:#C3CCDD;padding:16px 10px;display:flex;flex-direction:column;gap:2px;flex:none}
.mside .lg{display:flex;align-items:center;gap:9px;color:#fff;font-weight:600;font-size:14px;padding:4px 8px 14px}
.mside .lg span{width:24px;height:24px;border-radius:50%;background:#1A5CFF;display:grid;place-items:center;font-size:10px;font-weight:700}
.mside button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#C3CCDD;padding:8px 10px;border-radius:8px;text-align:left;font-size:13px;width:100%}
.mside button:hover{background:rgba(255,255,255,.05)}
.mside button.on{background:#1C3156;color:#fff}
.mside button.subi{padding-left:34px;font-size:12.5px}
.mmain{flex:1;overflow:auto;min-width:0}
.mpad{padding:22px 26px}
.mh1{font-size:20px;margin:0 0 4px;letter-spacing:-.015em}
.mp{color:#5E6A82;margin:0 0 14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid #E1E6EF;margin-bottom:14px}
.tabs button{border:0;background:transparent;padding:8px 10px;color:#5E6A82;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:#1A5CFF;border-bottom-color:#1A5CFF}

document.addEventListener('change', e => {
  if (e.target.dataset.jump) return jump(e.target.value);
  if (e.target.dataset.model === 'cfg.applyTo') { st.cfg.dirty = true; toast(`Policy will apply to: ${e.target.value}`); }
});
window.addEventListener('resize', () => fit());
document.addEventListener('keydown', e => {
  if (e.target.closest('textarea,input,select')) return;
  if (st.welcome === 'intro' && (e.key === 'Enter' || e.key === 'ArrowRight')) { e.preventDefault(); return act('begin'); }
  if (st.welcome) return;
  if (e.key === 'ArrowRight') nextStep(); else if (e.key === 'ArrowLeft') stepTo(si - 1);
});
stepTo(0);
</script>
